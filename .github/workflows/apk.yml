name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: App address and signing key
        env:
          KS_B64: ${{ secrets.TK_KEYSTORE_B64 }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "APP_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HAS_KS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KS=false" >> "$GITHUB_ENV"
            echo "::warning::TK_KEYSTORE_B64 secret not set — using a one-time key. Later APKs won't install over this one."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias teamkaam -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass teamkaam -keypass teamkaam -dname "CN=Team Kaam"
          fi
          echo "TK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          TK_KS_PASS: ${{ secrets.TK_KEYSTORE_PASS || 'teamkaam' }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            msg=$( (grep -E "error:|What went wrong|Could not|> |e: " "$RUNNER_TEMP/gradle.log" | head -40; tail -n 15 "$RUNNER_TEMP/gradle.log") | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=APK build failed::$msg"; exit 1; }

      - name: Signing key missing
        if: env.HAS_KS != 'true'
        run: echo "::warning::APK built but NOT published — add TK_KEYSTORE_B64 and TK_KEYSTORE_PASS secrets, then re-run this workflow."

      - name: Publish APK
        if: env.HAS_KS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TeamKaam.apk
          gh release create "apk-${{ github.run_number }}" TeamKaam.apk \
            --title "Team Kaam APK (${{ github.run_number }})" \
            --notes "ये APK WhatsApp पर भेजें। Install करते समय phone 'unknown apps' की permission माँगे तो Allow करें। App खुलने पर Admin का दिया Login ID और password डालें।" \
            --latest
